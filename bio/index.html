<style>
:root{
  --wine:#441019; --red:#d9042b; --orange:#ff7900; --yellow:#ffda40; --olive:#879e00;
  --pink:#f288c2; --sky:#a5bae7; --blue:#1e56ba; --cream:#f2ead0;
  --sans:'Montserrat', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --serif:'Times New Roman', Times, Georgia, 'Liberation Serif', serif;
  --hand:'Caveat', 'Segoe Print', 'Comic Sans MS', cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:var(--sans);background:var(--cream);color:var(--wine);-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

.page{position:relative;isolation:isolate;overflow:hidden;width:100%;max-width:460px;min-height:100vh;padding:52px 20px 44px}
.page::before{content:"";position:absolute;inset:-20% -30%;z-index:-1;pointer-events:none;
  background:
   radial-gradient(30% 36% at 12% 10%, rgba(242,136,194,.55), transparent 70%),
   radial-gradient(28% 34% at 85% 8%, rgba(165,186,231,.5), transparent 70%),
   radial-gradient(32% 38% at 90% 80%, rgba(135,158,0,.35), transparent 70%),
   radial-gradient(30% 36% at 10% 85%, rgba(255,218,64,.5), transparent 70%);
  filter:blur(30px) saturate(1.1)}

.badge{position:absolute;right:14px;top:26px;width:clamp(88px,22vw,112px);aspect-ratio:1;z-index:3;animation:spin 14s linear infinite}
.badge text{font:800 10px var(--sans);letter-spacing:.14em;text-transform:uppercase;fill:var(--wine)}
@keyframes spin{to{rotate:360deg}}

.head{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:26px}
.avatar-wrap{position:relative;width:132px;height:132px}
.avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 0 0 4px var(--wine)}
.online{position:absolute;right:4px;top:6px;width:22px;height:22px;border-radius:50%;background:#25d366;border:4px solid var(--wine)}
.hi{position:relative;margin-top:-14px;background:var(--yellow);color:var(--wine);border:2px solid var(--wine);box-shadow:0 4px 0 var(--wine);border-radius:999px;padding:7px 16px;font-family:var(--hand);font-weight:700;font-size:1.15rem;transform:rotate(-4deg);display:inline-flex;align-items:center;gap:6px}

.name{margin:22px 0 0;font-weight:900;text-transform:uppercase;letter-spacing:-.03em;line-height:.9;font-size:clamp(2.4rem,11vw,3.2rem)}
.name em{display:block;font-family:var(--serif);font-style:italic;font-weight:700;text-transform:none;color:var(--red);font-size:.78em;margin-top:.1em}
.role{margin:14px 0 0;font-weight:600;font-size:1.02rem}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:18px 0 0;padding:0;list-style:none}
.tags li{border:1.5px solid var(--wine);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.78rem;text-transform:uppercase;background:rgba(255,255,255,.65)}

.links{display:flex;flex-direction:column;gap:14px;margin-top:30px;padding:0;list-style:none}
.row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:20px;border:2.5px solid var(--wine);box-shadow:0 5px 0 var(--wine);background:#fff;transition:transform .15s ease, box-shadow .15s ease}
.row:hover{transform:translateY(2px);box-shadow:0 3px 0 var(--wine)}
.row:active{transform:translateY(5px);box-shadow:0 0 0 var(--wine)}
.row.yellow{background:var(--yellow)}
.row.wine{background:var(--wine);color:var(--cream);border-color:var(--cream);box-shadow:0 5px 0 var(--cream)}
.row.wine:hover{box-shadow:0 3px 0 var(--cream)}
.row.wine:active{box-shadow:0 0 0 var(--cream)}
.row.wine .row-sub{color:var(--yellow)}
.ico{flex:0 0 auto;width:46px;height:46px;border-radius:16px;display:grid;place-items:center}
.ico svg{width:22px;height:22px}
.ico.wa{background:#25d366;transform:rotate(-6deg)}
.ico.land{background:var(--yellow);transform:rotate(4deg)}
.ico.land svg{fill:var(--wine)}
.ico.ig{background:var(--pink);transform:rotate(-3deg)}
.ico.be{background:var(--blue);transform:rotate(5deg);font-family:var(--serif);font-style:italic;font-weight:700;color:#fff;font-size:1.15rem}
.row-body{flex:1;min-width:0;display:flex;flex-direction:column}
.row-title{font-weight:900;text-transform:uppercase;font-size:1.02rem;letter-spacing:-.01em}
.row-sub{font-weight:600;font-size:.82rem;opacity:.85}
.row-arrow{flex:0 0 auto;font-size:1.2rem;font-weight:700}

.foot{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:46px}
.foot img{height:30px;width:auto}
.foot span{font-weight:600;font-size:.82rem;opacity:.75}

@media (prefers-reduced-motion: reduce){.badge{animation:none}}
</style>
</head>
<body>

      <span class="row-arrow" aria-hidden="true">→</span>
    </a></li>
    <li><a class="row" href="https://instagram.com/luvana.dg" target="_blank" rel="noopener">
      <span class="ico ig"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="6"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1.1" fill="#fff" stroke="none"/></svg></span>
      <span class="row-body"><span class="row-title">Instagram</span><span class="row-sub">@luvana.dg</span></span>
      <span class="row-arrow" aria-hidden="true">→</span>
    </a></li>
    <li><a class="row" href="https://behance.net/luanacantero" target="_blank" rel="noopener">
      <span class="ico be">Bē</span>
      <span class="row-body"><span class="row-title">Behance</span><span class="row-sub">behance.net/luanacantero</span></span>
      <span class="row-arrow" aria-hidden="true">→</span>
    </a></li>
  </ul></nav>

  <div class="foot">
    <img src="assets/luvana-horizontal-degrade.png" alt="Luvana">
    <span>Trabajo con marcas de todo el mundo ✦</span>
  </div>
</div>
</body>
</html>
